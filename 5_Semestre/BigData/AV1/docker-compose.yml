version: '3.8'

services:

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mybridge

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - mybridge

  neo4j:
    image: neo4j
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/test
    volumes:
      - neo4j_data:/data
    networks:
      - mybridge

  jupyter:
    image: jupyter/base-notebook
    container_name: jupyter
    ports:
      - "8888:8888"
    networks:
      - mybridge

volumes:
  mongo_data:
  neo4j_data:

networks:
  mybridge: